<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnythingLLM Workspace Tester</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      color: #171717;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #171717;
    }
    .brand span {
      font-size: 13px;
      color: #737373;
    }
    .links {
      display: flex;
      gap: 10px;
    }
    .link-btn {
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      color: #171717;
      background: #ffffff;
      border: 1px solid #d4d4d4;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .link-btn:hover {
      background: #f5f5f5;
    }
    .workspace-split {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 57px);
    }
    .col {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
    }
    .col-header {
      padding: 10px 16px;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #404040;
    }
    .col-header a {
      font-size: 12px;
      font-weight: 400;
      color: #737373;
      text-decoration: none;
    }
    .col-header a:hover {
      text-decoration: underline;
    }
    .col iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>AnythingLLM Workspace Isolation Tester</h1>
      <span>Kiểm tra độc lập dữ liệu giữa các Workspace</span>
    </div>
    <div class="links">
      <a href="test_apalink.html" target="_blank" class="link-btn">Mở riêng Apalink ↗</a>
      <a href="test_kokowa.html" target="_blank" class="link-btn">Mở riêng Kokowa ↗</a>
    </div>
  </header>

  <div class="workspace-split">
    <div class="col">
      <div class="col-header">
        <span>Workspace: wp_apalink</span>
        <a href="test_apalink.html" target="_blank">Toàn màn hình ↗</a>
      </div>
      <iframe src="test_apalink.html"></iframe>
    </div>

    <div class="col">
      <div class="col-header">
        <span>Workspace: wp_kokowa</span>
        <a href="test_kokowa.html" target="_blank">Toàn màn hình ↗</a>
      </div>
      <iframe src="test_kokowa.html"></iframe>
    </div>
  </div>
</body>
</html>
